# Official-SBI arm: the circuit over Shiohara & Yamasaki's RELEASED encoder.
#
# Every circuit number in this project was measured on OUR SBI reimplementation,
# which scores 0.8312 on FF++ c23 and 0.6901 on Celeb-DF (Finding 12) against
# 0.8657 / 0.8921 for the released weights on the same crops. So the whole stack
# has been evaluated on a representation that loses 0.22 AUC crossing datasets,
# and Finding 9 (probability mass) has never had a fair cross-dataset test.
#
# This config swaps in the published encoder and changes nothing else, so the
# circuit rows can be compared to the ones in STATUS.md line for line.
#
# Weights: python -m gdown 1X0-NYT8KPursLZZdxduRQju6E52hauV0 -O FFc23.tar
root: /home/jawa17/deepfake_data
seed: 0
device: cuda

data:
  ffpp_root: raw/ffpp/FaceForensics++_C23
  splits_dir: .
  n_frames_train: 32
  n_frames_test: 32
  crop_size: 256
  margin: 1.3
  detector: mediapipe
  workers: 8
  include_dfd: false

features:
  backbone: official_sbi
  backbone_kwargs:
    checkpoint: /home/jawa17/deepfake_data/models/official_sbi/FFc23.tar
    grid: 8
    input_size: 380
  batch: 64
  grid: 8
  out_dim: 16              # channels per patch after whitening -> d = 1024
  whiten: true
  max_projector_images: 20000

pc:
  n_sum_components: 8
  n_input_components: 8
  leaf_components: 4
  patch_method: kd         # spatial prior; ablated against orc / chow_liu
  channel_method: orc      # Ollivier-Ricci curvature cuts over channels
  max_arity: 4
  epochs: 60
  batch_size: 256
  lr: 0.005
  patience: 8
  topq: 0.05

baselines: [mahalanobis, gmm, patchcore, flow]

eval:
  test_datasets: [ffpp]
  robustness: [clean, jpeg70, jpeg50, resize0.5, blur]
