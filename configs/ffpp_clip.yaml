# Main configuration: frozen CLIP ViT-L/14 patch tokens + circuit density.
#
# This is the "pure one-class" arm — nothing in the pipeline is trained on any
# forgery, and the representation is frozen off-the-shelf.  It is the cleanest
# scientific statement and the weakest expected detector; `ffpp_sbi.yaml` is the
# arm with a chance at state-of-the-art numbers.
root: /home/jawa17/deepfake_data
seed: 0
device: cuda

data:
  ffpp_root: raw/ffpp/FaceForensics++_C23
  splits_dir: .
  n_frames_train: 32
  n_frames_test: 32
  crop_size: 256
  margin: 1.3
  detector: mediapipe
  workers: 8
  include_dfd: false

features:
  backbone: clip           # clip | dinov2 | sbi | srm
  batch: 64
  grid: 8                  # 16x16 CLIP patches pooled to 8x8 -> 64 regions
  out_dim: 16              # channels per patch after whitening -> d = 1024
  whiten: true
  max_projector_images: 20000

pc:
  n_sum_components: 8
  n_input_components: 8
  leaf_components: 4
  patch_method: kd         # spatial prior; ablated against orc / chow_liu
  channel_method: orc      # Ollivier-Ricci curvature cuts over channels
  max_arity: 4
  epochs: 60
  batch_size: 256
  lr: 0.005
  patience: 8
  topq: 0.05

baselines: [mahalanobis, gmm, patchcore, flow]

eval:
  test_datasets: [ffpp]
  robustness: [clean, jpeg70, jpeg50, resize0.5, blur]
