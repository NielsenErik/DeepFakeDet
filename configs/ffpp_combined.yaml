# Combined arm: SBI encoder features + spectral residual features.
#
# The two arms fail and succeed for different reasons, so neither subsumes the
# other:
#   sbi       trained on self-blends -> captures BLENDING GEOMETRY; the only
#             representation that closed the probe-minus-one-class gap (0.047)
#   spectral  Corvi et al. residual spectrum -> captures GENERATOR NOISE traces
#             and is far more uniform across manipulation types (probe
#             0.73-0.84 per method vs CLIP's 0.59-0.92)
#
# Channels are standardized within each source before concatenation so neither
# dominates by scale; d = 64 patches x (16 + 95) = 7104.
root: /home/jawa17/deepfake_data
seed: 0
device: auto

data:
  ffpp_root: raw/ffpp/FaceForensics++_C23
  splits_dir: .
  n_frames_train: 32
  n_frames_test: 32
  crop_size: 256
  margin: 1.3
  detector: mediapipe
  workers: 8
  include_dfd: false

features:
  backbone: combined
  batch: 64
  grid: 8
  out_dim: 0          # keep every coordinate; see above
  whiten: false
  max_projector_images: 20000

pc:
  n_sum_components: 8
  n_input_components: 8
  leaf_components: 4
  patch_method: kd
  channel_method: orc
  max_arity: 4
  epochs: 60
  batch_size: 64        # d = 6080 -> the leaf layer alone is ~50M elements/batch
  lr: 0.005
  patience: 8
  topq: 0.05

baselines: [mahalanobis, gmm, patchcore, flow]

eval:
  test_datasets: [ffpp]
  robustness: [clean, jpeg70, jpeg50, resize0.5, blur]
